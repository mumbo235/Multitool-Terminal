        /* ==========================================================================
       Terminal Games: Overhauled Live Dungeon RPG (5 Floors, In-Place Live Screen)
       ========================================================================== */
    function cmdDungeon() {
      const hasKatana = wallet.inventory.includes('Laser Katana');
      const hasShield = wallet.inventory.includes('Nano Shield');
      const hasPotion = wallet.inventory.includes('Health Elixir');
      const hasVip = wallet.inventory.includes('Golden VIP');

      const startingMaxHp = hasPotion ? 160 : 100;
      const player = {
        x: 1,
        y: 1,
        hp: startingMaxHp,
        maxHp: startingMaxHp,
        atk: 16 + (hasKatana ? 14 : 0),
        def: 4 + (hasShield ? 8 : 0),
        level: 1,
        xp: 0,
        xpNext: 45,
        floor: 1,
        gold: 0,
        potions: hasPotion ? 2 : 1,
        keys: 0
      };

      const W = 16;
      const H = 9;

      const FLOOR_THEMES = {
        1: { name: 'The Sunken Catacombs', maxMonster: 3 },
        2: { name: 'The Crypt of Whispers', maxMonster: 4 },
        3: { name: 'The Iron Armory', maxMonster: 4 },
        4: { name: 'The Nether Depths', maxMonster: 5 },
        5: { name: 'The Dragon Sanctum', maxMonster: 4 }
      };

      function generateFloor(floorNum) {
        let map = [];
        for (let y = 0; y < H; y++) {
          let row = [];
          for (let x = 0; x < W; x++) {
            if (x === 0 || x === W - 1 || y === 0 || y === H - 1) {
              row.push('#');
            } else {
              row.push('.');
            }
          }
          map.push(row);
        }

        // Add procedural inner obstacles
        const obstacleCount = 4 + floorNum;
        for (let i = 0; i < obstacleCount; i++) {
          const rx = Math.floor(Math.random() * (W - 4)) + 2;
          const ry = Math.floor(Math.random() * (H - 4)) + 2;
          if (rx !== 1 || ry !== 1) {
            map[ry][rx] = '#';
          }
        }

        let monsters = [];
        if (floorNum === 1) {
          monsters.push({ x: 5, y: 2, type: 'G', name: 'Goblin Scout', hp: 20, atk: 7, def: 2, xp: 20, gold: 25 });
          monsters.push({ x: 10, y: 5, type: 'B', name: 'Cave Bat', hp: 14, atk: 6, def: 1, xp: 15, gold: 18, dodge: 0.2 });
          monsters.push({ x: 7, y: 6, type: 'G', name: 'Goblin Raider', hp: 24, atk: 8, def: 2, xp: 25, gold: 30 });
        } else if (floorNum === 2) {
          monsters.push({ x: 6, y: 3, type: 'S', name: 'Skeleton Guard', hp: 32, atk: 11, def: 4, xp: 35, gold: 45 });
          monsters.push({ x: 11, y: 2, type: 'V', name: 'Poison Viper', hp: 24, atk: 12, def: 2, xp: 30, gold: 40 });
          monsters.push({ x: 12, y: 6, type: 'S', name: 'Skeleton Archer', hp: 30, atk: 13, def: 3, xp: 35, gold: 50 });
        } else if (floorNum === 3) {
          monsters.push({ x: 6, y: 2, type: 'O', name: 'Orc Warrior', hp: 44, atk: 15, def: 5, xp: 50, gold: 65 });
          monsters.push({ x: 10, y: 4, type: 'S', name: 'Cursed Skeleton', hp: 38, atk: 14, def: 4, xp: 40, gold: 55 });
          monsters.push({ x: 13, y: 6, type: 'O', name: 'Orc Brute', hp: 50, atk: 16, def: 5, xp: 60, gold: 75 });
        } else if (floorNum === 4) {
          monsters.push({ x: 5, y: 3, type: 'N', name: 'Nether Demon', hp: 56, atk: 18, def: 6, xp: 75, gold: 90 });
          monsters.push({ x: 9, y: 5, type: 'O', name: 'Orc Warlord', hp: 52, atk: 17, def: 6, xp: 70, gold: 85 });
          monsters.push({ x: 12, y: 3, type: 'N', name: 'Shadow Stalker', hp: 48, atk: 20, def: 5, xp: 80, gold: 95 });
        } else if (floorNum === 5) {
          // Final Boss floor
          monsters.push({ x: 5, y: 4, type: 'N', name: 'Nether Guard', hp: 55, atk: 18, def: 6, xp: 75, gold: 90 });
          monsters.push({ x: 11, y: 4, type: 'D', name: 'Ancient Nether Dragon [BOSS]', hp: 125, atk: 23, def: 8, xp: 250, gold: 500, isBoss: true });
        }

        let items = [
          { x: 3, y: 5, type: '$', value: Math.floor(Math.random() * 30) + 35, name: 'Gold Cache' },
          { x: 12, y: 2, type: '$', value: Math.floor(Math.random() * 40) + 40, name: 'Chest of Credits' },
          { x: 8, y: 6, type: 'P', name: 'Health Potion' }
        ];

        // Shrines and interactive elements
        if (floorNum === 2) {
          items.push({ x: 4, y: 2, type: 'W', name: 'Ancient Weapon Shrine (+4 ATK)' });
        } else if (floorNum === 3) {
          items.push({ x: 3, y: 2, type: 'K', name: 'Dungeon Vault Key' });
          items.push({ x: 13, y: 3, type: 'X', name: 'Locked Vault Door' });
          items.push({ x: 14, y: 3, type: '$', value: 120, name: 'Vault Treasure' });
        } else if (floorNum === 4) {
          items.push({ x: 4, y: 6, type: 'A', name: 'Rune Armor Shrine (+3 DEF)' });
        }

        // Add 1 or 2 spike traps per floor
        let traps = [];
        if (floorNum >= 2) {
          traps.push({ x: 7, y: 3, dmg: 10 });
        }
        if (floorNum >= 3) {
          traps.push({ x: 11, y: 5, dmg: 14 });
        }

        let stairs = { x: W - 2, y: H - 2 };
        return { map, monsters, items, traps, stairs, floorNum };
      }

      let currentFloor = generateFloor(1);
      let eventLogs = [
        "[+] You stepped into the dark dungeon depths. Defeat monsters and find loot!",
        "[*] Controls: W/A/S/D or Arrow keys to move/attack, P to drink potion, Q to escape."
      ];

      function addLog(msg) {
        eventLogs.unshift(msg);
        if (eventLogs.length > 4) eventLogs.pop();
      }

      // Create live container ONCE in terminalOutput
      const liveId = 'dungeon-session-' + Date.now();
      printRaw(`
<div id="${liveId}" class="dungeon-live-wrap" style="margin: 6px 0; background: rgba(0,0,0,0.25); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 14px;">
  <div id="${liveId}-header" class="text-accent text-bold" style="font-size: 15px; margin-bottom: 6px;"></div>
  <div id="${liveId}-hud" style="font-family: var(--font-mono); margin-bottom: 6px;"></div>
  <pre id="${liveId}-board" style="line-height: 1.2; font-family: var(--font-mono); font-size: 14px; letter-spacing: 2px; margin: 4px 0; user-select: none;"></pre>
  <div id="${liveId}-log" style="min-height: 52px; margin-top: 6px; font-family: var(--font-mono); font-size: 12px; line-height: 1.4;"></div>
  <div class="text-dim" style="font-size: 12px; margin-top: 6px; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 4px;">
    Controls: <b>[W/A/S/D or Arrow Keys]</b> Live Move/Attack &bull; <b>[P]</b> Drink Potion &bull; <b>[Q / Esc]</b> Escape with Loot &bull; <b>[H]</b> Legend
  </div>
</div>
`);

      const containerEl = document.getElementById(liveId);
      const headerEl = document.getElementById(liveId + '-header');
      const hudEl = document.getElementById(liveId + '-hud');
      const boardEl = document.getElementById(liveId + '-board');
      const logEl = document.getElementById(liveId + '-log');

      let isDungeonActive = true;

      function renderLiveDungeon() {
        if (!containerEl || !isDungeonActive) return;

        const theme = FLOOR_THEMES[player.floor] || { name: 'Dungeon Depths' };
        headerEl.innerHTML = `[ ROGUE DUNGEON RPG &bull; FLOOR ${player.floor}/5: ${escapeHtml(theme.name)} ]`;

        // Health bar calculation
        const hpPercent = Math.max(0, Math.min(100, (player.hp / player.maxHp) * 100));
        const hpBlocksTotal = 16;
        const hpFilled = Math.round((hpPercent / 100) * hpBlocksTotal);
        const hpBar = `[${'|'.repeat(hpFilled)}${'.'.repeat(hpBlocksTotal - hpFilled)}]`;
        const hpColor = hpPercent > 50 ? 'symbol-success' : (hpPercent > 25 ? 'text-warning' : 'symbol-error');

        // XP bar calculation
        const xpPercent = Math.max(0, Math.min(100, (player.xp / player.xpNext) * 100));
        const xpFilled = Math.round((xpPercent / 100) * 8);
        const xpBar = `[${'='.repeat(xpFilled)}${'-'.repeat(8 - xpFilled)}]`;

        hudEl.innerHTML = `
<div class="help-grid" style="grid-template-columns: 180px 140px 110px 1fr; gap: 4px 10px;">
  <div>HP: <b class="${hpColor}">${hpBar} ${player.hp}/${player.maxHp}</b></div>
  <div>XP: <b>${xpBar} Lv.${player.level}</b></div>
  <div>ATK: <b>${player.atk}</b> &bull; DEF: <b>${player.def}</b></div>
  <div>Loot: <b class="text-accent">${player.gold} CR</b> &bull; Potions: <b>${player.potions}</b> &bull; Keys: <b>${player.keys}</b></div>
</div>
`;

        // Render live map
        let lines = [];
        for (let y = 0; y < H; y++) {
          let rowChars = [];
          for (let x = 0; x < W; x++) {
            if (x === player.x && y === player.y) {
              rowChars.push('<b class="text-accent" style="color: var(--prompt-user); font-weight: bold;">@</b>');
            } else {
              const monster = currentFloor.monsters.find(m => m.x === x && m.y === y);
              if (monster) {
                const color = monster.isBoss ? 'color: #ff5555; font-size: 15px;' : 'color: var(--error-color);';
                rowChars.push(`<b style="${color}">${monster.type}</b>`);
              } else {
                const item = currentFloor.items.find(it => it.x === x && it.y === y);
                if (item) {
                  if (item.type === '$') {
                    rowChars.push('<b class="text-accent" style="color: var(--warning-color);">$</b>');
                  } else if (item.type === 'P') {
                    rowChars.push('<b class="symbol-success" style="color: var(--success-color);">P</b>');
                  } else if (item.type === 'W' || item.type === 'A') {
                    rowChars.push('<b class="text-info" style="color: var(--info-color);">' + item.type + '</b>');
                  } else if (item.type === 'K') {
                    rowChars.push('<b style="color: #f1fa8c;">K</b>');
                  } else if (item.type === 'X') {
                    rowChars.push('<b style="color: #ffb86c;">X</b>');
                  } else {
                    rowChars.push('?');
                  }
                } else if (currentFloor.traps && currentFloor.traps.some(t => t.x === x && t.y === y && t.revealed)) {
                  rowChars.push('<b style="color: #ff5555;">^</b>');
                } else if (currentFloor.stairs.x === x && currentFloor.stairs.y === y) {
                  rowChars.push('<b class="text-info" style="color: var(--accent-color); font-weight: bold;">&gt;</b>');
                } else {
                  rowChars.push(currentFloor.map[y][x]);
                }
              }
            }
          }
          lines.push(rowChars.join(' '));
        }
        boardEl.innerHTML = lines.join('\n');

        // Render event log
        logEl.innerHTML = eventLogs.map(l => {
          let cls = 'text-dim';
          if (l.startsWith('[+]') || l.startsWith('[VICTORY]')) cls = 'symbol-success text-bold';
          else if (l.startsWith('[-]') || l.startsWith('[!]')) cls = 'symbol-error';
          else if (l.startsWith('[*]')) cls = 'text-accent text-bold';
          return `<div class="${cls}">&bull; ${escapeHtml(l)}</div>`;
        }).join('');
      }

      function levelUpCheck() {
        if (player.xp >= player.xpNext) {
          player.level++;
          player.xp -= player.xpNext;
          player.xpNext = Math.floor(player.xpNext * 1.55);
          player.maxHp += 20;
          player.hp = Math.min(player.maxHp, player.hp + 30);
          player.atk += 3;
          player.def += 2;
          playChime();
          addLog(`[*] LEVEL UP! Reached Lv.${player.level}! Max HP +20, ATK +3, DEF +2!`);
        }
      }

      function drinkPotion() {
        if (player.potions <= 0) {
          addLog("[-] No potions in your pack! Find potions [P] on dungeon floors.");
          renderLiveDungeon();
          return;
        }
        player.potions--;
        const healed = Math.min(player.maxHp - player.hp, 45);
        player.hp += healed;
        playChime();
        addLog(`[+] Drank Health Potion! Restored +${healed} HP (${player.hp}/${player.maxHp}).`);
        renderLiveDungeon();
      }

      function finishDungeon(status, message) {
        isDungeonActive = false;
        window.removeEventListener('keydown', onDungeonKey);
        wizardHandler = null;

        if (status === 'win') {
          playChime();
          wallet.balance += player.gold;
          wallet.stats.dungeonsCleared = (wallet.stats.dungeonsCleared || 0) + 1;
          if (!wallet.inventory.includes('Dungeon Conqueror')) {
            wallet.inventory.push('Dungeon Conqueror');
          }
          if (player.floor === 5 && !wallet.inventory.includes('Nether Slayer')) {
            wallet.inventory.push('Nether Slayer');
          }
          saveWallet();

          addLog(`[VICTORY] ${message}`);
          renderLiveDungeon();
          printRaw(`
<div class="symbol-success text-bold" style="font-size: 15px; margin-top: 8px;">[ DUNGEON VICTORY! ANCIENT NETHER DRAGON SLAIN ]</div>
<div>You completed all 5 floors and conquered the dungeon!</div>
<div>Earned: <b class="text-accent">+${player.gold} CR</b> (including 500 CR Boss Bonus) and the <b>[Nether Slayer]</b> badge!</div>
<div>New wallet balance: <b class="text-accent">${wallet.balance.toLocaleString()} CR</b>.</div>
`);
        } else if (status === 'escape') {
          if (player.gold > 0) {
            wallet.balance += player.gold;
            saveWallet();
            playChime();
            printSuccess(`Retreated from dungeon safely! Deposited <b>+${player.gold} CR</b> into your wallet. Balance: <b>${wallet.balance.toLocaleString()} CR</b>.`);
          } else {
            printInfo("Escaped dungeon safely. No gold looted.");
          }
        } else if (status === 'death') {
          printRaw(`
<div class="symbol-error text-bold" style="font-size: 15px; margin-top: 8px;">[ YOU PERISHED IN THE DUNGEON ]</div>
<div>Fell on Floor ${player.floor} (${FLOOR_THEMES[player.floor]?.name || 'Dungeon'}). All <b>${player.gold} CR</b> loot was lost in the ruins.</div>
<div class="text-dim">Upgrade your gear in 'shop' (Laser Katana, Nano Shield) and return stronger!</div>
`);
        }
      }

      function executeAction(act) {
        if (!isDungeonActive) return;

        if (act === 'q' || act === 'escape' || act === 'exit') {
          finishDungeon('escape', 'Retreated safely.');
          return;
        }

        if (act === 'p' || act === 'potion') {
          drinkPotion();
          return;
        }

        if (act === 'h' || act === 'help') {
          addLog("[*] LEGEND: @:You #:Wall .:Floor $:Gold P:Potion K:Key X:Vault W:Weapon A:Armor ^:Trap >:Stairs");
          renderLiveDungeon();
          return;
        }

        let dx = 0, dy = 0;
        if (act === 'w' || act === 'up') dy = -1;
        else if (act === 's' || act === 'down') dy = 1;
        else if (act === 'a' || act === 'left') dx = -1;
        else if (act === 'd' || act === 'right') dx = 1;
        else return;

        const nx = player.x + dx;
        const ny = player.y + dy;

        // Check walls and borders
        if (nx < 0 || nx >= W || ny < 0 || ny >= H || currentFloor.map[ny][nx] === '#') {
          addLog("[-] Blocked by solid stone wall.");
          renderLiveDungeon();
          return;
        }

        // Check locked vault doors
        const vaultIdx = currentFloor.items.findIndex(it => it.x === nx && it.y === ny && it.type === 'X');
        if (vaultIdx !== -1) {
          if (player.keys > 0) {
            player.keys--;
            currentFloor.items.splice(vaultIdx, 1);
            playChime();
            addLog("[+] Used Dungeon Key! Unlocked the Vault Door!");
            renderLiveDungeon();
          } else {
            addLog("[-] Locked Vault Door! Find a Key [K] on this floor to open.");
            renderLiveDungeon();
          }
          return;
        }

        // Check monster combat
        const mIdx = currentFloor.monsters.findIndex(m => m.x === nx && m.y === ny);
        if (mIdx !== -1) {
          const monster = currentFloor.monsters[mIdx];
          
          // Player attack
          const isCrit = Math.random() < 0.18;
          let playerDmg = Math.max(3, player.atk - monster.def);
          if (isCrit) playerDmg = Math.round(playerDmg * 1.75);

          // Monster dodge check
          if (monster.dodge && Math.random() < monster.dodge) {
            addLog(`[-] ${monster.name} dodged your swift strike!`);
          } else {
            monster.hp -= playerDmg;
            addLog(`[+] Hit ${monster.name} for ${playerDmg} DMG!${isCrit ? ' [CRITICAL!]' : ''}`);
          }

          if (monster.hp <= 0) {
            // Defeated
            currentFloor.monsters.splice(mIdx, 1);
            let earnedGold = monster.gold;
            if (hasVip) earnedGold = Math.round(earnedGold * 1.15);
            player.gold += earnedGold;
            player.xp += monster.xp;
            addLog(`[+] Slew ${monster.name}! Looted +${earnedGold} CR and +${monster.xp} XP!`);
            levelUpCheck();

            if (monster.isBoss) {
              finishDungeon('win', 'The Ancient Nether Dragon has collapsed! Victory!');
              return;
            }
          } else {
            // Monster counter-attacks
            const monsterDmg = Math.max(2, monster.atk - player.def);
            player.hp -= monsterDmg;
            addLog(`[-] ${monster.name} retaliated for ${monsterDmg} DMG!`);

            if (player.hp <= 0) {
              finishDungeon('death', `Slain by ${monster.name}.`);
              return;
            }
          }

          renderLiveDungeon();
          return;
        }

        // Check items pickup
        const itemIdx = currentFloor.items.findIndex(it => it.x === nx && it.y === ny);
        if (itemIdx !== -1) {
          const item = currentFloor.items[itemIdx];
          if (item.type === '$') {
            let val = item.value;
            if (hasVip) val = Math.round(val * 1.15);
            player.gold += val;
            addLog(`[+] Opened chest! Collected +${val} CR!`);
          } else if (item.type === 'P') {
            player.potions++;
            addLog("[+] Picked up Health Potion! [P] to drink anytime.");
          } else if (item.type === 'K') {
            player.keys++;
            addLog("[+] Found Dungeon Key! Use it to unlock Vault Doors [X].");
          } else if (item.type === 'W') {
            player.atk += 4;
            playChime();
            addLog("[*] Channelled Weapon Shrine! ATK permanently increased +4!");
          } else if (item.type === 'A') {
            player.def += 3;
            playChime();
            addLog("[*] Channelled Armor Shrine! DEF permanently increased +3!");
          }
          currentFloor.items.splice(itemIdx, 1);
        }

        // Check traps
        if (currentFloor.traps) {
          const trap = currentFloor.traps.find(t => t.x === nx && t.y === ny);
          if (trap) {
            trap.revealed = true;
            player.hp -= trap.dmg;
            addLog(`[-] Stepped on a hidden Spike Trap! Suffered ${trap.dmg} DMG.`);
            if (player.hp <= 0) {
              finishDungeon('death', 'Died from a spike trap.');
              return;
            }
          }
        }

        // Move player
        player.x = nx;
        player.y = ny;

        // Check stairs
        if (player.x === currentFloor.stairs.x && player.y === currentFloor.stairs.y) {
          if (player.floor < 5) {
            player.floor++;
            currentFloor = generateFloor(player.floor);
            player.x = 1;
            player.y = 1;
            addLog(`[*] Descended deeper into Floor ${player.floor}: ${FLOOR_THEMES[player.floor].name}!`);
          }
        }

        renderLiveDungeon();
      }

    function cmdSnake() {
      const W = 20;
      const H = 10;
      let snake = [
        { x: 10, y: 5 },
        { x: 9, y: 5 },
        { x: 8, y: 5 }
      ];
      let dir = { x: 1, y: 0 };
      let nextDir = { x: 1, y: 0 };
      let score = 0;
      let gameOver = false;

      function randomFood() {
        let fx, fy;
        while (true) {
          fx = Math.floor(Math.random() * (W - 2)) + 1;
          fy = Math.floor(Math.random() * (H - 2)) + 1;
          if (!snake.some(s => s.x === fx && s.y === fy)) break;
        }
        return { x: fx, y: fy };
      }

      let food = randomFood();

      const boardId = 'snake-screen-' + Date.now();
      printRaw(`
<div class="text-accent text-bold">[ TERMINAL SNAKE ] &bull; Controls: Arrow Keys or W/A/S/D &bull; Q / Esc to quit</div>
<pre id="${boardId}" style="line-height: 1.1; font-family: var(--font-mono); margin: 6px 0;"></pre>
<div id="${boardId}-status">Score: 0 &bull; Credits: 0 CR</div>
`);

      const boardEl = document.getElementById(boardId);
      const statusEl = document.getElementById(boardId + '-status');

      function render() {
        if (!boardEl) return;
        let grid = [];
        for (let y = 0; y < H; y++) {
          let row = '';
          for (let x = 0; x < W; x++) {
            if (x === 0 || x === W - 1 || y === 0 || y === H - 1) {
              row += '#';
            } else if (snake[0].x === x && snake[0].y === y) {
              row += 'O';
            } else if (snake.slice(1).some(s => s.x === x && s.y === y)) {
              row += 'o';
            } else if (food.x === x && food.y === y) {
              row += '*';
            } else {
              row += ' ';
            }
          }
          grid.push(row);
        }
        boardEl.textContent = grid.join('\n');
        if (statusEl) {
          statusEl.textContent = `Score: ${score} | Earned: ${score * 4} CR | Length: ${snake.length}`;
        }
      }

      render();

      function onKey(e) {
        const k = e.key.toLowerCase();
        if (k === 'arrowup' || k === 'w') {
          if (dir.y === 0) nextDir = { x: 0, y: -1 };
          e.preventDefault();
        } else if (k === 'arrowdown' || k === 's') {
          if (dir.y === 0) nextDir = { x: 0, y: 1 };
          e.preventDefault();
        } else if (k === 'arrowleft' || k === 'a') {
          if (dir.x === 0) nextDir = { x: -1, y: 0 };
          e.preventDefault();
        } else if (k === 'arrowright' || k === 'd') {
          if (dir.x === 0) nextDir = { x: 1, y: 0 };
          e.preventDefault();
        } else if (k === 'q' || k === 'escape') {
          stopGame();
          e.preventDefault();
        }
      }

      window.addEventListener('keydown', onKey);

      const timer = setInterval(() => {
        if (gameOver) return;
        dir = nextDir;
        const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

        if (head.x <= 0 || head.x >= W - 1 || head.y <= 0 || head.y >= H - 1) {
          gameOver = true;
          stopGame();
          return;
        }
        if (snake.some(s => s.x === head.x && s.y === head.y)) {
          gameOver = true;
          stopGame();
          return;
        }

        snake.unshift(head);
        if (head.x === food.x && head.y === food.y) {
          score += 1;
          food = randomFood();
        } else {
          snake.pop();
        }
        render();
      }, 190);

      function stopGame() {
        clearInterval(timer);
        window.removeEventListener('keydown', onKey);
        const reward = score * 4;
        if (reward > 0) {
          wallet.balance += reward;
          saveWallet();
          playChime();
        }
        if (statusEl) {
          statusEl.innerHTML = `<span class="symbol-error text-bold">[GAME OVER]</span> Final Score: <b>${score}</b> &bull; Payout: <b class="text-accent">+${reward} CR</b>! Balance: <b>${wallet.balance.toLocaleString()} CR</b>`;
        }
      }
    }

    ];

    let currentGhostMatch = '';

    function hideGhostAutocomplete() {
      currentGhostMatch = '';
      if (ghostTyped) ghostTyped.textContent = '';
      if (ghostText) ghostText.textContent = '';
    }

    function updateGhostAutocomplete() {
      if (!ghostText || !ghostTyped) return;
      if (loginStep || wizardHandler || modelPickerActive || cmdInput.type === 'password') {
        hideGhostAutocomplete();
        return;
      }

      const raw = cmdInput.value;
      if (!raw || !raw.trim()) {
        hideGhostAutocomplete();
        return;
      }

      const query = raw.toLowerCase();

      // 1. Search recent command history first (fish shell / zsh autosuggestions)
      let match = '';
      if (commandHistory && commandHistory.length > 0) {
        for (let i = commandHistory.length - 1; i >= 0; i--) {
          const h = commandHistory[i];
          if (h && h.toLowerCase().startsWith(query) && h.length > raw.length) {
            match = h;
            break;
          }
        }
      }

      // 2. If not found in history, match closest command from AUTOCOMPLETE_COMMANDS
      if (!match) {
        const found = AUTOCOMPLETE_COMMANDS.find(c => c.toLowerCase().startsWith(query) && c.length > raw.length);
        if (found) {
          match = found;
        }
      }

      if (!match) {
        hideGhostAutocomplete();
        return;
      }

      currentGhostMatch = match;
      ghostTyped.textContent = raw;
      ghostText.textContent = match.slice(raw.length);
      if (ghostLayer) {
        ghostLayer.scrollLeft = cmdInput.scrollLeft;
      }
    }

    function acceptGhostAutocomplete() {
      let target = currentGhostMatch;
      if (!target) {
        const raw = cmdInput.value;
        if (raw && raw.trim()) {
          const query = raw.toLowerCase().trim();
          target = AUTOCOMPLETE_COMMANDS.find(c => c.toLowerCase().startsWith(query) && c.length > query.length) || '';
        }
      }

      if (!target) return;

      const needsSpace = !target.includes(' ') && !target.endsWith(' ');
      cmdInput.value = needsSpace ? target + ' ' : target;
      cmdInput.selectionStart = cmdInput.selectionEnd = cmdInput.value.length;
      hideGhostAutocomplete();
      updateGhostAutocomplete();
    }
